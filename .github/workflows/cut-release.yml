name: Cut release

# The button that ships a release. Run it from the Actions tab, pick how far to
# move the version, and it bumps both manifests, commits, tags, and starts the
# release. Nothing to edit by hand and nothing to remember.
#
# Every step before the push is a guard, and each covers something that cannot
# be undone: an npm version is immutable, and a tag that fails to release has to
# be deleted by hand before it can be retried. The cheap checks run first so a
# mistake costs seconds rather than a half-finished release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'How far to move the version'
        required: true
        # `current` is the default because it is what a first release needs: the
        # manifests already carry the version, and bumping would skip it. After
        # that it is also the right answer for re-cutting a release that failed
        # before it published anything. Choosing it when the version *has* been
        # released is caught — the tag already exists.
        default: current
        type: choice
        options:
          - current      # release the version the manifests already carry
          - prerelease   # 0.1.0-rc.1 -> 0.1.0-rc.2
          - release      # 0.1.0-rc.1 -> 0.1.0   (graduate the candidate)
          - patch        # 0.1.0      -> 0.1.1
          - minor        # 0.1.0      -> 0.2.0
          - major        # 0.1.0      -> 1.0.0
          - prepatch     # 0.1.0      -> 0.1.1-rc.0
          - preminor     # 0.1.0      -> 0.2.0-rc.0
          - premajor     # 0.1.0      -> 1.0.0-rc.0
      preid:
        description: 'Prerelease identifier, for the pre* bumps'
        required: false
        default: rc
        type: string
      dry_run:
        description: 'Work out the version and run every check, but tag nothing'
        required: false
        default: false
        type: boolean

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    runs-on: ubuntu-latest

    # Holds RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY, and only main may deploy
    # to it. Add required reviewers here to gate a release on an approval.
    environment: release

    permissions:
      # Read-only, deliberately. The version bump is pushed with a GitHub App
      # token minted below, not with GITHUB_TOKEN — see that step for why — so
      # the default token never needs write access to the repository at all.
      contents: read

    steps:
      # `main` is protected by a ruleset requiring changes to arrive through a
      # pull request, and the version bump is a direct push — so it needs a
      # bypass. GITHUB_TOKEN cannot have one: GitHub's eligible bypass actors
      # are repository roles, teams, GitHub Apps and Dependabot, and the
      # `github-actions` bot is none of those. A GitHub App can, and the
      # `lattice-release` app is on the ruleset's bypass list.
      #
      # This also means the push is made by a credential that is not
      # GITHUB_TOKEN, so it *does* trigger workflows — CI now runs on the
      # version-bump commit, which the previous arrangement silently skipped.
      - name: Mint a token that may push to main
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          # The app token, so the credential git persists for the push below is
          # the one holding the bypass rather than the default one that does not.
          token: ${{ steps.app-token.outputs.token }}
          # Tags, so the "does this already exist" check can see them, and full
          # history for the ancestry check below.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # Inputs travel through `env:` rather than `${{ }}` interpolation. `${{ }}`
      # is substituted into the script text before the shell ever sees it, so an
      # input containing shell metacharacters would be executed rather than read.
      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs --self-test
          node scripts/bump-version.mjs "${BUMP}" --preid "${PREID}"

      - name: Check the tag, the registry and the branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"

          # The manifests were just rewritten — this proves the result is
          # publishable and internally consistent before anything is committed.
          # Same script CI runs on every PR.
          node scripts/check-release.mjs "${tag}"

          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "tag ${tag} already exists — delete it first, or pick a different bump"
            exit 1
          fi

          # An npm version is immutable. Finding it already published means this
          # release is finished or half-done, and tagging again will not help.
          for name in lattice-tokens lattice-react; do
            package="@chameleon-labs/${name}"
            published="$(npm view "${package}@${VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${VERSION}" ]; then
              echo "${package}@${VERSION} is already on npm — versions cannot be republished"
              exit 1
            fi
          done

          # Release from the tip of main, and only from main.
          #
          # `workflow_dispatch` can be run against any branch, and the version
          # bump below is pushed to whichever ref that is. An ancestry check
          # alone was not enough: any commit already merged into main passes it,
          # so dispatching from a stale branch would have committed the bump to
          # that branch and left the published tag on a commit main does not
          # contain — a release nobody can find from the default branch.
          #
          # Requiring the exact tip rather than mere reachability also means a
          # main that moved between dispatch and run is a re-run rather than a
          # silent release of something older than intended.
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "releases are cut from main — this run is on '${GITHUB_REF_NAME}'"
            exit 1
          fi

          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "HEAD ($(git rev-parse --short HEAD)) is not the tip of origin/main ($(git rev-parse --short origin/main))"
            echo "main moved since this run started — dispatch it again"
            exit 1
          fi

          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "ok: ${tag} is ready to cut from $(git rev-parse --short HEAD)"

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # The app's own identity, not `github-actions[bot]`. The app is what
          # holds the bypass and what actually pushes, so attributing the commit
          # to anything else would make the audit log disagree with the ruleset
          # about who wrote to main. The numeric id is looked up rather than
          # hardcoded: the `<id>+<slug>@users.noreply.github.com` form is what
          # links the commit to the bot account on GitHub, and the id is issued
          # per app.
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add packages/*/package.json

          # A `current` release changes no file, so there is nothing to commit
          # and the tag simply lands on the commit that is already there.
          # `git commit` would fail on an empty index rather than no-op.
          if git diff --cached --quiet; then
            echo "version unchanged at ${VERSION} — tagging the existing commit"
          else
            git commit -m "Release ${VERSION}" -m "${PREVIOUS} -> ${VERSION}, cut by ${GITHUB_ACTOR}."
            # Explicitly to main, not to the ref this was dispatched on. The
            # guard above already proved they are the same thing; naming main
            # here means a future change to that guard cannot quietly turn this
            # into a push to somewhere else.
            #
            # The commit first, then the tag. If this push is rejected — a
            # protected branch, or main having moved under us — the tag does not
            # exist remotely yet and there is nothing to unpick.
            git push origin HEAD:main
          fi

          # Annotated, not lightweight: the tag carries who cut it and when,
          # which is what the generated release notes are anchored against.
          git tag -a "${TAG}" -m "Lattice ${VERSION}"

          # This push is what starts the release, and nothing dispatches it
          # explicitly any more.
          #
          # The dispatch existed because a tag pushed with GITHUB_TOKEN does not
          # fire `on: push: tags` — GitHub suppresses events raised by that token
          # so a workflow cannot loop. The push is now made with a GitHub App
          # installation token, which is not GITHUB_TOKEN and therefore does fire
          # it. Keeping the dispatch as well would start the same release twice:
          # `release.yml`'s concurrency group serialises them, so the second run
          # would find the version already published, skip the publish, and then
          # fail creating a GitHub Release that already exists — a red run after
          # every successful release.
          #
          # `release.yml` keeps its `workflow_dispatch` trigger as the manual
          # path for re-running a release against an existing tag.
          git push origin "${TAG}"
          echo "pushed ${TAG} — release.yml starts from the tag event"

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "${DRY_RUN}" = "true" ]; then
              echo "### Dry run — nothing was tagged"
              echo
              echo "\`${PREVIOUS}\` → \`${VERSION}\`, and every check passed."
            else
              echo "### Cut \`${TAG}\`"
              echo
              echo "- \`${PREVIOUS}\` → \`${VERSION}\` on commit \`$(git rev-parse --short HEAD)\`"
              echo "- released by [release.yml](../../actions/workflows/release.yml), started by the tag push"
              echo "- publishing \`@chameleon-labs/lattice-tokens@${VERSION}\` and \`@chameleon-labs/lattice-react@${VERSION}\`"
              echo
              echo "Nothing is on npm yet — the release workflow runs the full contract suite first."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
