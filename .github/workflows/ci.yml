name: CI

# The colour spec's claim is that the contrast contracts fail the build. Without
# this workflow that was true only on a developer's machine: nothing ran the
# suite on a pull request, so every green result was a report rather than a gate.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Read from the workspace root rather than pinned here, so the version
          # this runs on cannot drift from the one the package declares.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Firefox
        run: pnpm --filter @chameleon-labs/lattice-tokens exec playwright install --with-deps firefox

      # The React package's Storybook preview imports the emitted token
      # stylesheet, and dist/ is gitignored — so the artefact has to exist before
      # its browser tests run. The full `pnpm -r build` below still runs for
      # every package; this is the one ordering dependency that cannot wait for
      # it.
      - name: Build tokens
        run: pnpm --filter @chameleon-labs/lattice-tokens build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Runs last because it is the slowest and the most complete: it generates
      # every scale, gates on the contrast contracts, and writes the artefacts.
      # A contract failure exits non-zero here and nothing reaches dist/.
      - name: Build
        run: pnpm -r build

      # The browser tests run Storybook in dev mode, which tolerates things the
      # production build does not. Nothing is deployed yet, so without this step
      # a Storybook that had stopped building would go unnoticed until the day
      # someone tried to publish it.
      - name: Build Storybook
        run: pnpm build-storybook

      # dist/ is gitignored, so a broken emit would otherwise be invisible until
      # release. This proves every published file exists and is non-empty.
      - name: Verify emitted artefacts
        run: |
          set -euo pipefail
          for f in packages/tokens/dist/lattice.css \
                   packages/tokens/dist/tokens.json \
                   packages/react/dist/index.js \
                   packages/react/dist/index.d.ts \
                   packages/react/dist/styles.css; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done
