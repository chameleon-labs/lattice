name: Release

# Releases are cut by pushing a tag:
#
#   git tag v0.1.0-rc.1 && git push origin v0.1.0-rc.1
#
# The tag triggers the release rather than a push to main, because a release
# that fires on every merge cannot be reasoned about afterwards and cannot be
# re-run against a known commit. The tag is the record of what shipped.
#
# The whole contract suite runs again here even though CI already ran it on the
# same commit. A tag can be moved; a release is the one job where "it passed on
# some earlier run" is not good enough.
#
# Who can start one: both triggers are restricted to accounts with write access
# to this repository, by GitHub rather than by anything written here — pushing a
# tag requires it, and `workflow_dispatch` is documented as requiring it too. An
# outside contributor, a fork, or a pull request from either cannot reach this
# workflow. The `npm-publish` environment on the job below is where that can be
# tightened further (required reviewers, or a smaller list of who may approve).
on:
  push:
    tags: ['v*']
  # The manual path: re-running a release against a tag that already exists,
  # after fixing whatever made the first attempt fail.
  #
  # It is no longer how `cut-release.yml` starts a release. That used to dispatch
  # this workflow explicitly, because a tag pushed with GITHUB_TOKEN does not
  # fire the `push` trigger above — GitHub suppresses events raised by that token
  # so a workflow cannot loop. `cut-release` now pushes with a GitHub App
  # installation token, which is not GITHUB_TOKEN and does fire it, so the tag
  # event is the normal path again and dispatching as well would start the same
  # release twice.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0-rc.1'
        required: true
        type: string

# Two publishes of the same version cannot converge — the first wins and the
# second is a 403. Serialise rather than race.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Named in each package's trusted publisher config, so this is part of what
    # npm checks before exchanging the OIDC token — a job in another environment
    # is refused even from this workflow. Add required reviewers here to make
    # every release need a second pair of eyes; the workflow needs no change.
    # Only `v*` tags may deploy to it, so a manual re-run is dispatched from the
    # tag rather than from a branch.
    environment: npm-publish

    permissions:
      # The OIDC token trusted publishing exchanges for a registry credential,
      # and what the automatic provenance attestation is signed against.
      id-token: write
      # Creating the GitHub Release at the end.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # On a dispatch the workflow may be running from a branch, so check
          # out the tag being released explicitly rather than whatever ref
          # triggered it. On a tag push the two are the same thing.
          ref: ${{ inputs.tag || github.ref }}
          # `gh release --notes-start-tag` needs the previous tag, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
          # No `registry-url`. It writes an .npmrc carrying
          # `_authToken=${NODE_AUTH_TOKEN}`, and with no token supplied setup-node
          # fills in its own placeholder — so npm authenticates with a dud string
          # instead of falling back to OIDC, and the publish 404s. The default
          # registry is registry.npmjs.org anyway, and each package's
          # publishConfig carries its access.

      # A prerelease must not become `latest`, or `npm i @chameleon-labs/…`
      # hands every consumer an RC. npm tags whatever it publishes `latest`
      # unless told otherwise, so the dist-tag is derived from the version
      # rather than remembered: 0.1.0-rc.1 -> `rc`, 0.1.0 -> `latest`.
      - name: Derive the version and dist-tag
        env:
          # Through the environment, not `${{ }}` interpolation: `${{ }}` is
          # substituted into the script text before the shell sees it, so an
          # input carrying shell metacharacters would be executed rather than read.
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$GITHUB_REF_NAME}"
          case "${tag}" in
            v*) ;;
            *) echo "not a release tag: ${tag}"; exit 1 ;;
          esac
          version="${tag#v}"
          case "${version}" in
            *-*)
              prerelease="${version#*-}"
              dist_tag="${prerelease%%.*}"
              is_prerelease=true
              ;;
            *)
              dist_tag=latest
              is_prerelease=false
              ;;
          esac
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "DIST_TAG=${dist_tag}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${is_prerelease}" >> "$GITHUB_ENV"
          echo "releasing ${tag}: publishing ${version} under dist-tag '${dist_tag}' (prerelease: ${is_prerelease})"

      - run: pnpm install --frozen-lockfile

      - name: Install Firefox
        run: pnpm --filter @chameleon-labs/lattice-tokens exec playwright install --with-deps firefox

      # Fails on a package still marked private, a version that disagrees with
      # the tag, or an `exports` entry that would 404 for consumers — before
      # anything is built, and long before anything is published.
      - name: Check release preconditions
        run: node scripts/check-release.mjs "${TAG}"

      - name: Build tokens
        run: pnpm --filter @chameleon-labs/lattice-tokens build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      # Packs both packages into .release/ and proves each tarball is
      # consumable. The publish step below ships these exact files rather than
      # rebuilding, so nothing can change between the check and the release.
      - name: Pack and verify tarballs
        run: node scripts/verify-tarballs.mjs

      # Tokens first: the React package's peer range names a token version, and
      # a consumer installing react in the window between the two publishes
      # should find a resolvable peer rather than a 404.
      # npm does the publishing, not pnpm: pnpm 10.7 cannot do trusted
      # publishing, and an unattested package is not a release.
      #
      # No registry credential in this job. npm exchanges the OIDC token GitHub
      # mints for it against the trusted publisher configured on each package —
      # chameleon-labs/lattice, release.yml, environment npm-publish. All four
      # have to match or the exchange is refused.
      - name: Publish to npm
        run: |
          set -euo pipefail
          for name in lattice-tokens lattice-react; do
            package="@chameleon-labs/${name}"
            tarball=".release/chameleon-labs-${name}-${VERSION}.tgz"
            test -s "${tarball}" || { echo "missing tarball: ${tarball}"; exit 1; }

            # Skip anything already on the registry, so this step is resumable.
            # An npm version is immutable, so a re-run after a later step failed
            # would otherwise die here on a version conflict — which is exactly
            # what happened on 0.1.0-rc.1: both packages published fine, the
            # verification below timed out, and the job could not be re-run to
            # finish the release because the publish would no longer succeed.
            published="$(npm view "${package}@${VERSION}" version --prefer-online 2>/dev/null || true)"
            if [ "${published}" = "${VERSION}" ]; then
              echo "${package}@${VERSION} is already on npm — skipping"
              continue
            fi

            echo "publishing ${tarball} under dist-tag '${DIST_TAG}'"
            # No --provenance: trusted publishing attests automatically.
            # An ENEEDAUTH here means the OIDC exchange bailed, and npm's is written
            # never to throw — re-run with --loglevel verbose to get the reason.
            npm publish "${tarball}" --access public --tag "${DIST_TAG}"
          done

      # The exit code is not the evidence. A publish that skips a private
      # package exits 0 having done nothing — precisely the failure this release
      # is written to avoid — so the registry is asked directly.
      #
      # Ten minutes, not one. The first release measured this: both packages
      # published successfully at 20:58:38 and the packument did not answer
      # until 21:03:59 — five minutes and twenty seconds. The original window
      # was fifty seconds, so it failed a release that had in fact worked, and
      # left the GitHub Release uncreated. A package's *first* appearance is the
      # slow case; later versions show up in seconds, and this loop exits as
      # soon as it sees one, so the ceiling costs nothing in the normal case.
      #
      # `--prefer-online` because npm caches registry responses, negative ones
      # included: without it the poll can keep re-reading its own cached 404
      # and never notice the package arriving.
      - name: Verify the packages are on npm
        run: |
          set -euo pipefail
          attempts=40
          for name in lattice-tokens lattice-react; do
            package="@chameleon-labs/${name}"
            for attempt in $(seq 1 "${attempts}"); do
              found="$(npm view "${package}@${VERSION}" version --prefer-online 2>/dev/null || true)"
              if [ "${found}" = "${VERSION}" ]; then
                echo "ok: ${package}@${VERSION} is on npm"
                break
              fi
              if [ "${attempt}" = "${attempts}" ]; then
                echo "${package}@${VERSION} did not appear within 10 minutes"
                exit 1
              fi
              echo "waiting for ${package}@${VERSION} to appear (attempt ${attempt}/${attempts})…"
              sleep 15
            done

            # A forgotten `--tag` is silent: the publish succeeds and `latest`
            # quietly moves to the RC. Assert it did not — except on a first
            # publish, where it is not a mistake and cannot be avoided.
            #
            # npm requires every package to carry a `latest`, and the first
            # version published becomes it whatever `--tag` says, because there
            # is nothing else to point at. 0.1.0-rc.1 is `latest` on both
            # packages for exactly that reason, and it corrects itself the
            # moment a stable version ships. Failing the release over it would
            # be failing over a rule of the registry, so this reports instead.
            if [ "${IS_PRERELEASE}" = "true" ]; then
              latest="$(npm view "${package}" dist-tags.latest --prefer-online 2>/dev/null || true)"
              if [ "${latest}" = "${VERSION}" ]; then
                count="$(npm view "${package}" versions --json --prefer-online 2>/dev/null \
                  | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s);console.log(Array.isArray(v)?v.length:1)}catch{console.log(0)}})")"
                if [ "${count}" = "1" ]; then
                  echo "note: ${package} has only this version, so npm made the prerelease 'latest'."
                  echo "      Unavoidable on a first publish; it moves when a stable version ships."
                else
                  echo "${package}: prerelease ${VERSION} became dist-tag 'latest' alongside ${count} other versions"
                  exit 1
                fi
              else
                echo "ok: ${package} 'latest' is '${latest:-unset}', not the prerelease"
              fi
            fi
          done

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `--notes` alongside `--generate-notes` is deliberate and supported:
          # `gh release create --help` states that "additional release notes can
          # be prepended to automatically generated notes by using the --notes
          # flag". So the line below sits above the generated changelog rather
          # than replacing it. Raised in review as a conflict; it is not one.
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          args=(--title "${TAG}" --generate-notes)
          if [ -n "${previous}" ]; then args+=(--notes-start-tag "${previous}"); fi
          if [ "${IS_PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
          gh release create "${TAG}" "${args[@]}" \
            --notes "Published \`@chameleon-labs/lattice-tokens@${VERSION}\` and \`@chameleon-labs/lattice-react@${VERSION}\` to npm with provenance, under the \`${DIST_TAG}\` dist-tag."
